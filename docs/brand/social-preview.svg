<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#f5f4ee"/>
  <circle cx="1180" cy="-40" r="340" fill="#d97757" opacity=".08"/>
  <g transform="translate(96 150) scale(.33)"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34332f"/>
      <stop offset="1" stop-color="#1c1b1a"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfbf7"/>
      <stop offset="1" stop-color="#e4dfd2"/>
    </linearGradient>
    <linearGradient id="clay" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec9772"/>
      <stop offset="1" stop-color="#c25738"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c3a3"/>
      <stop offset="1" stop-color="#df9a74"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".30"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lower-arm"><polygon points="412,500 552,500 712,724 572,724"/></clipPath>
  </defs>
  <!-- macOS icon grid: 824px squircle-like tile with a soft drop shadow -->
  
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="3"/>
  <g stroke-linejoin="round" stroke-width="16">
    <!-- Lower arm (light clay) -->
    <polygon points="412,500 552,500 712,724 572,724" fill="url(#sand)" stroke="url(#sand)"/>
    <!-- Fold shadow cast by the upper arm onto the lower arm -->
    <polygon points="400,500 600,500 660,600 400,600" fill="url(#fold)" stroke="none" clip-path="url(#lower-arm)"/>
    <!-- Upper arm (terracotta) -->
    <polygon points="562,300 702,300 552,520 412,520" fill="url(#clay)" stroke="url(#clay)"/>
    <!-- Stem (ivory) -->
    <polygon points="312,300 432,300 432,724 312,724" fill="url(#ivory)" stroke="url(#ivory)"/>
  </g>
</g>
  <text x="470" y="292" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="88" font-weight="600" fill="#1f1e1d" letter-spacing="-2">Kuberniva</text>
  <text x="474" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#c96442">Kubernetes, in focus.</text>
  <text x="474" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#4d4a43">A fast, native desktop workspace for many clusters.</text>
  <text x="96" y="572" font-family="Menlo, monospace" font-size="20" fill="#817d74">github.com/velqa/Kuberniva</text>
</svg>
